[package]
name = "spacehunter"
description = "SpaceHunter – fast, modern disk-usage treemap (2D & 3D)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
spacehunter-core = { path = "../core" }
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui_glow = "0.36"
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Storage", "Document", "Element", "HtmlElement", "HtmlInputElement", "FileList", "File", "Blob", "DragEvent", "DataTransfer", "DataTransferItem", "DataTransferItemList", "FileSystemDirectoryHandle", "FileSystemFileHandle", "FileSystemHandle", "FileSystemHandleKind", "console", "Navigator", "ServiceWorkerContainer", "HtmlCanvasElement"] }
