name: build
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p spacehunter-core
  windows:
    runs-on: windows-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p spacehunter --bin spacehunter
      - run: Copy-Item target/release/spacehunter.exe SpaceHunter.exe
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with: { name: SpaceHunter-windows, path: SpaceHunter.exe }
      # Rolling "latest" release: the landing page links to
      # https://github.com/quisen/SpaceHunter/releases/latest/download/SpaceHunter.exe
      - name: Publish latest .exe
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest SpaceHunter.exe --target "$GITHUB_SHA" \
            --title "SpaceHunter (latest build)" \
            --notes "Automatic build of commit ${GITHUB_SHA::7}. Windows x64, portable – just run it."
